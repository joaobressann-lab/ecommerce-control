name: Pipeline diario

# Cron diario 06h BRT (09h UTC) + disparo manual. CLAUDE.md secao 1 e F1.6.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write  # necessario para o commit automatico dos data/*.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Autovalidacao offline (sem rede, sem Secrets): falha rapido se a logica quebrou.
      - name: Testes offline
        run: python -m tests.test_offline

      # Pipeline: builder monta produtos.json + diario.json + relatorio de excecoes.
      - name: Rodar pipeline
        env:
          NUVEMSHOP_STORE1_ID: ${{ secrets.NUVEMSHOP_STORE1_ID }}
          NUVEMSHOP_STORE1_TOKEN: ${{ secrets.NUVEMSHOP_STORE1_TOKEN }}
          NUVEMSHOP_STORE2_ID: ${{ secrets.NUVEMSHOP_STORE2_ID }}
          NUVEMSHOP_STORE2_TOKEN: ${{ secrets.NUVEMSHOP_STORE2_TOKEN }}
          NUVEMSHOP_USER_AGENT: ${{ secrets.NUVEMSHOP_USER_AGENT }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
        run: python -m pipeline.run_build

      # Sem [skip ci]: o push dos dados dispara o redeploy diario do Netlify (que serve
      # os JSONs junto do site; repo privado). O proprio workflow nao tem trigger de push,
      # entao nao ha risco de loop.
      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: atualizacao diaria dos dados"
          git push

      # Redeploy garantido do Netlify via build hook (o webhook de push nem sempre dispara).
      # Criar o hook em Site configuration > Build & deploy > Build hooks e salvar a URL
      # no Secret NETLIFY_BUILD_HOOK. Passo e opcional: sem o Secret, so avisa.
      - name: Disparar deploy Netlify (build hook)
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -s -X POST -d '{}' "$HOOK" && echo "build hook disparado"
          else
            echo "NETLIFY_BUILD_HOOK ausente; pulei o redeploy automatico"
          fi
