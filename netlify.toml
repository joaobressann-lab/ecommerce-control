# Netlify: publica o dashboard estatico com os JSONs de dados juntos (repo privado,
# sem raw.githubusercontent). O build so copia data/ para dentro do publish dir.
# O commit diario de dados da Action dispara o redeploy (sem [skip ci]).
[build]
  publish = "dashboard"
  command = "cp -r data dashboard/data"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
